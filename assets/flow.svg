<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>

  <!-- AGENTS.md band -->
  <rect x="30" y="24" width="1340" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="700" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">AGENTS.md, the project-memory block, read by every session of every agent</text>
  <text x="700" y="68" text-anchor="middle" font-size="14" fill="#334155">start at docs/index.md · every code change belongs to a spec · answer what the product does from docs/behavior/ · the rest of the file stays yours</text>

  <!-- stage title -->
  <text x="30" y="118" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">ONE SPEC, FROM INTENT TO PULL REQUEST</text>

  <!-- spec-start -->
  <rect x="30" y="132" width="300" height="130" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">why + what</text>
  <text x="180" y="182" text-anchor="middle" font-size="15" fill="#1e40af" font-family="Menlo, Consolas, monospace">spec-start</text>
  <text x="180" y="208" text-anchor="middle" fill="#1e3a8a">from a sentence, a ticket or commits</text>
  <text x="180" y="227" text-anchor="middle" fill="#1e3a8a">grilled in rounds, a recommended answer each</text>
  <text x="180" y="246" text-anchor="middle" fill="#1e3a8a">claims with IDs · the owner's go recorded</text>
  <text x="180" y="286" text-anchor="middle" font-size="13" fill="#475569">writes spec.md</text>

  <!-- spec-plan (dashed: features only) -->
  <rect x="380" y="132" width="300" height="130" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="530" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">how</text>
  <text x="530" y="182" text-anchor="middle" font-size="15" fill="#5b21b6" font-family="Menlo, Consolas, monospace">spec-plan</text>
  <text x="530" y="208" text-anchor="middle" fill="#4c1d95">only with the go on record</text>
  <text x="530" y="227" text-anchor="middle" fill="#4c1d95">tasks that fit one session, each naming</text>
  <text x="530" y="246" text-anchor="middle" fill="#4c1d95">the claims that prove it · waits for your OK</text>
  <text x="530" y="286" text-anchor="middle" font-size="13" fill="#475569">writes plan.md, tasks.md, reference/, a decision</text>

  <!-- spec-build -->
  <rect x="730" y="132" width="300" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="880" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">build</text>
  <text x="880" y="182" text-anchor="middle" font-size="15" fill="#166534" font-family="Menlo, Consolas, monospace">spec-build</text>
  <text x="880" y="208" text-anchor="middle" fill="#14532d">reads tasks.md first, names the next task</text>
  <text x="880" y="227" text-anchor="middle" fill="#14532d">one task at a time · failing test first</text>
  <text x="880" y="246" text-anchor="middle" fill="#14532d">only the plan's files · ticks on proof</text>
  <text x="880" y="286" text-anchor="middle" font-size="13" fill="#475569">writes code, tests named by claim, task notes</text>

  <!-- spec-ship -->
  <rect x="1080" y="132" width="290" height="130" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1225" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#7c2d12">ship</text>
  <text x="1225" y="182" text-anchor="middle" font-size="15" fill="#9a3412" font-family="Menlo, Consolas, monospace">spec-ship</text>
  <text x="1225" y="208" text-anchor="middle" fill="#7c2d12">tests, then a reviewer who did not</text>
  <text x="1225" y="227" text-anchor="middle" fill="#7c2d12">write the code · status shipped</text>
  <text x="1225" y="246" text-anchor="middle" fill="#7c2d12">PR title and description · never merges</text>
  <text x="1225" y="286" text-anchor="middle" font-size="13" fill="#475569">writes behavior/, architecture/, the PR text</text>

  <!-- arrows between stages -->
  <line x1="332" y1="197" x2="376" y2="197" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="682" y1="197" x2="726" y2="197" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1032" y1="197" x2="1076" y2="197" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- fix fast path: start straight to build -->
  <path d="M 100 264 L 100 318 L 880 318 L 880 264" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="530" y="312" text-anchor="middle" font-size="13" fill="#1e40af">a fix skips the plan: one pass, a failing test, no go unless it changes a claim</text>

  <!-- resume loop on build -->
  <path d="M 940 132 L 940 108 L 1000 108 L 1000 132" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="970" y="102" text-anchor="middle" font-size="12" fill="#166534">next session: "continue"</text>

  <!-- change of course loop -->
  <path d="M 1030 240 L 1055 240 L 1055 352 L 300 352 L 300 264" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-loop)"/>
  <text x="680" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">a change of mind mid-way: update spec.md or plan.md, recheck every task, the owner says go again · scope growth becomes a follow-up spec</text>

  <!-- practices -->
  <text x="30" y="414" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">TWO PRACTICES THE AGENT LOADS ON ITS OWN</text>
  <rect x="30" y="426" width="660" height="84" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="48" y="450" font-size="15" font-weight="700" fill="#0f172a" font-family="Menlo, Consolas, monospace">grilling</text>
  <text x="48" y="472" fill="#334155">looks facts up in the docs and the code before asking · 3 to 5 questions a round</text>
  <text x="48" y="492" fill="#334155">a recommended answer each · every answer written where it belongs as it settles</text>
  <rect x="710" y="426" width="660" height="84" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="728" y="450" font-size="15" font-weight="700" fill="#0f172a" font-family="Menlo, Consolas, monospace">docs-conventions</text>
  <text x="728" y="472" fill="#334155">the file charter: one job per file, and where misplaced content goes</text>
  <text x="728" y="492" fill="#334155">the templates · the claim format: one testable sentence, an ID, an example</text>

  <!-- docs/ memory band -->
  <text x="30" y="548" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">PROJECT MEMORY, IN YOUR REPO, READ FIRST IN EVERY SESSION</text>
  <rect x="30" y="560" width="1340" height="190" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="52" y="586" font-size="18" font-weight="700" fill="#713f12" font-family="Menlo, Consolas, monospace">docs/</text>

  <!-- docs commands inside the band, left -->
  <rect x="52" y="604" width="300" height="60" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="202" y="628" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a" font-family="Menlo, Consolas, monospace">docs-init</text>
  <text x="202" y="650" text-anchor="middle" font-size="13" fill="#134e4a">once per repo: index.md, stack.md, the block</text>
  <rect x="52" y="674" width="300" height="60" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="202" y="698" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a" font-family="Menlo, Consolas, monospace">docs-map</text>
  <text x="202" y="720" text-anchor="middle" font-size="13" fill="#134e4a">one domain at a time, when work first touches it</text>

  <!-- docs files -->
  <rect x="380" y="604" width="230" height="130" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="495" y="628" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12" font-family="Menlo, Consolas, monospace">index.md · glossary.md</text>
  <text x="495" y="652" text-anchor="middle" font-size="13" fill="#78350f">what the product is, its domains</text>
  <text x="495" y="670" text-anchor="middle" font-size="13" fill="#78350f">and who owns each</text>
  <text x="495" y="694" text-anchor="middle" font-size="13" fill="#78350f">shared words and their names</text>
  <text x="495" y="712" text-anchor="middle" font-size="13" fill="#78350f">in code</text>

  <rect x="630" y="604" width="230" height="130" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="745" y="628" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12" font-family="Menlo, Consolas, monospace">behavior/</text>
  <text x="745" y="652" text-anchor="middle" font-size="13" fill="#78350f">what the product does now</text>
  <text x="745" y="670" text-anchor="middle" font-size="13" fill="#78350f">one file per capability, claims</text>
  <text x="745" y="688" text-anchor="middle" font-size="13" fill="#78350f">with IDs, copied from shipped</text>
  <text x="745" y="706" text-anchor="middle" font-size="13" fill="#78350f">specs word for word</text>

  <rect x="880" y="604" width="230" height="130" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="995" y="628" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12" font-family="Menlo, Consolas, monospace">architecture/ · decisions/</text>
  <text x="995" y="652" text-anchor="middle" font-size="13" fill="#78350f">how it is built, one area per file</text>
  <text x="995" y="670" text-anchor="middle" font-size="13" fill="#78350f">stack, data model, boundaries</text>
  <text x="995" y="694" text-anchor="middle" font-size="13" fill="#78350f">why a lasting choice was made:</text>
  <text x="995" y="712" text-anchor="middle" font-size="13" fill="#78350f">context, options, consequences</text>

  <rect x="1130" y="604" width="220" height="130" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1240" y="628" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12" font-family="Menlo, Consolas, monospace">specs/&lt;date-slug&gt;/</text>
  <text x="1240" y="652" text-anchor="middle" font-size="13" fill="#78350f">one folder per change</text>
  <text x="1240" y="670" text-anchor="middle" font-size="13" fill="#78350f">spec.md · plan.md · tasks.md</text>
  <text x="1240" y="688" text-anchor="middle" font-size="13" fill="#78350f">reference/ for working material</text>
  <text x="1240" y="712" text-anchor="middle" font-size="13" fill="#78350f">a branch named after the slug</text>

  <!-- flexibility cards -->
  <text x="30" y="792" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">BUILT TO FIT AROUND WHAT YOU ALREADY USE</text>
  <rect x="30" y="804" width="430" height="150" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="245" y="832" text-anchor="middle" font-size="17" font-weight="700" fill="#831843">Stacks with your other skills</text>
  <text x="245" y="860" text-anchor="middle" fill="#9d174d">the pack holds only the workflow around a task</text>
  <text x="245" y="880" text-anchor="middle" fill="#9d174d">TDD, code quality, review or language skills</text>
  <text x="245" y="900" text-anchor="middle" fill="#9d174d">load alongside and shape the code itself</text>
  <text x="245" y="928" text-anchor="middle" font-size="13" fill="#be185d">tested: four skills active in one build session</text>

  <rect x="485" y="804" width="430" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="700" y="832" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Any agent, nothing to run</text>
  <text x="700" y="860" text-anchor="middle" fill="#1e40af">Claude Code and Codex, tested · Copilot CLI, installs</text>
  <text x="700" y="880" text-anchor="middle" fill="#1e40af">any Agent Skills agent by copying skills/</text>
  <text x="700" y="900" text-anchor="middle" fill="#1e40af">markdown only · git only · no server, no telemetry</text>
  <text x="700" y="928" text-anchor="middle" font-size="13" fill="#2563eb">one install per machine, or per repo, your choice</text>

  <rect x="940" y="804" width="430" height="150" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="1155" y="832" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Your rules win</text>
  <text x="1155" y="860" text-anchor="middle" fill="#166534">your AGENTS.md outranks every pack, this one too</text>
  <text x="1155" y="880" text-anchor="middle" fill="#166534">grill anything on request: a plan, an architecture</text>
  <text x="1155" y="900" text-anchor="middle" fill="#166534">change a spec mid-build without starting over</text>
  <text x="1155" y="928" text-anchor="middle" font-size="13" fill="#16a34a">every rule in the pack came from a run that broke it</text>
</svg>
