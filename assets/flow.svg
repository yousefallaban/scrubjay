<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2000" height="1000" fill="#ffffff"/>

  <!-- header -->
  <g stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="78" y="66" width="80" height="60" rx="16"/>
    <line x1="118" y1="66" x2="118" y2="46"/>
    <circle cx="118" cy="40" r="7" fill="#111827"/>
    <line x1="70" y1="88" x2="70" y2="106"/>
    <line x1="166" y1="88" x2="166" y2="106"/>
    <path d="M 108 108 Q 118 114 128 108"/>
  </g>
  <circle cx="101" cy="90" r="5" fill="#111827"/>
  <circle cx="135" cy="90" r="5" fill="#111827"/>
  <text x="200" y="116" font-size="70" font-weight="800" fill="#111827" letter-spacing="-1">AGENTS.md</text>
  <text x="204" y="158" font-size="19" fill="#64748b" letter-spacing="3.5">EVERY SESSION STARTS AT DOCS/   ·   EVERY CODE CHANGE BELONGS TO A SPEC</text>
  <text x="1935" y="78" text-anchor="end" font-size="19" fill="#64748b" letter-spacing="3.5">SPECS WITH A GO.</text>
  <text x="1935" y="108" text-anchor="end" font-size="19" fill="#64748b" letter-spacing="3.5">MEMORY IN DOCS/.</text>

  <!-- spec -->
  <rect x="65" y="220" width="410" height="300" rx="24" fill="#eef4ff"/>
  <text x="115" y="360" font-size="56" font-weight="800" fill="#111827">spec</text>
  <rect x="115" y="396" width="320" height="56" rx="10" fill="#dbe7ff"/>
  <text x="275" y="434" text-anchor="middle" font-size="26" fill="#1e40af" font-family="Menlo, Consolas, monospace">spec-start</text>
  <text x="115" y="492" font-size="22" fill="#64748b">spec.md · the owner's go</text>

  <!-- plan -->
  <rect x="553" y="220" width="410" height="300" rx="24" fill="#f3eefe"/>
  <text x="603" y="360" font-size="56" font-weight="800" fill="#111827">plan</text>
  <rect x="603" y="396" width="320" height="56" rx="10" fill="#e6dcfb"/>
  <text x="763" y="434" text-anchor="middle" font-size="26" fill="#5b21b6" font-family="Menlo, Consolas, monospace">spec-plan</text>
  <text x="603" y="492" font-size="22" fill="#64748b">plan.md · tasks.md</text>

  <!-- build -->
  <rect x="1041" y="220" width="410" height="300" rx="24" fill="#ecfbf3"/>
  <text x="1091" y="360" font-size="56" font-weight="800" fill="#111827">build</text>
  <rect x="1091" y="396" width="320" height="56" rx="10" fill="#d4f3e2"/>
  <text x="1251" y="434" text-anchor="middle" font-size="26" fill="#166534" font-family="Menlo, Consolas, monospace">spec-build</text>
  <text x="1091" y="492" font-size="22" fill="#64748b">code · tests, test first</text>

  <!-- ship -->
  <rect x="1529" y="220" width="406" height="300" rx="24" fill="#fff3e8"/>
  <text x="1579" y="360" font-size="56" font-weight="800" fill="#111827">ship</text>
  <rect x="1579" y="396" width="320" height="56" rx="10" fill="#fde4cf"/>
  <text x="1739" y="434" text-anchor="middle" font-size="26" fill="#9a3412" font-family="Menlo, Consolas, monospace">spec-ship</text>
  <text x="1579" y="492" font-size="22" fill="#64748b">docs updated · PR</text>

  <!-- arrows between cards -->
  <line x1="488" y1="370" x2="538" y2="370" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="976" y1="370" x2="1026" y2="370" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1464" y1="370" x2="1514" y2="370" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- change of mind: from build back to spec -->
  <path d="M 1246 522 L 1246 590 L 270 590 L 270 532" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="758" y="636" text-anchor="middle" font-size="23" fill="#475569">Changed your mind mid-build? Update the spec or the plan, recheck the tasks, go again.</text>

  <line x1="65" y1="686" x2="1935" y2="686" stroke="#e5e7eb" stroke-width="2"/>

  <!-- docs/ row -->
  <text x="65" y="772" font-size="40" font-weight="800" fill="#111827">docs/</text>

  <rect x="220" y="716" width="258" height="84" rx="16" fill="#eef4ff"/>
  <text x="256" y="770" font-size="28" fill="#2563eb" font-family="Menlo, Consolas, monospace" font-weight="700">&gt;_</text>
  <text x="312" y="769" font-size="26" font-weight="600" fill="#111827">docs-init</text>

  <rect x="502" y="716" width="258" height="84" rx="16" fill="#f3eefe"/>
  <text x="538" y="770" font-size="28" fill="#7c3aed" font-family="Menlo, Consolas, monospace" font-weight="700">&gt;_</text>
  <text x="594" y="769" font-size="26" font-weight="600" fill="#111827">docs-map</text>

    <rect x="784" y="716" width="258" height="84" rx="16" fill="#ecfbf3"/>
  <text x="876" y="769" font-size="26" font-weight="600" fill="#111827">behavior</text>
  <rect x="1066" y="716" width="258" height="84" rx="16" fill="#fff3e8"/>
  <text x="1158" y="769" font-size="26" font-weight="600" fill="#111827">architecture</text>
  <rect x="1348" y="716" width="258" height="84" rx="16" fill="#f3f4f6"/>
  <text x="1440" y="769" font-size="26" font-weight="600" fill="#111827">decisions</text>
  <rect x="1630" y="716" width="258" height="84" rx="16" fill="#f3f4f6"/>
  <text x="1722" y="769" font-size="26" font-weight="600" fill="#111827">specs</text>
  <g fill="none" stroke-width="3" stroke-linejoin="round">
    <path d="M 820 745 h 14 l 6 6 h 18 a 3 3 0 0 1 3 3 v 20 a 3 3 0 0 1 -3 3 h -38 a 3 3 0 0 1 -3 -3 v -26 a 3 3 0 0 1 3 -3 z" stroke="#16a34a"/>
    <path d="M 1102 745 h 14 l 6 6 h 18 a 3 3 0 0 1 3 3 v 20 a 3 3 0 0 1 -3 3 h -38 a 3 3 0 0 1 -3 -3 v -26 a 3 3 0 0 1 3 -3 z" stroke="#ea580c"/>
    <path d="M 1384 745 h 14 l 6 6 h 18 a 3 3 0 0 1 3 3 v 20 a 3 3 0 0 1 -3 3 h -38 a 3 3 0 0 1 -3 -3 v -26 a 3 3 0 0 1 3 -3 z" stroke="#475569"/>
    <path d="M 1666 745 h 14 l 6 6 h 18 a 3 3 0 0 1 3 3 v 20 a 3 3 0 0 1 -3 3 h -38 a 3 3 0 0 1 -3 -3 v -26 a 3 3 0 0 1 3 -3 z" stroke="#475569"/>
  </g>

  <line x1="65" y1="836" x2="1935" y2="836" stroke="#e5e7eb" stroke-width="2"/>

  <!-- practices band -->
  <rect x="65" y="864" width="1870" height="112" rx="20" fill="#f8fafc"/>
  <path d="M 108 896 h 44 a 10 10 0 0 1 10 10 v 24 a 10 10 0 0 1 -10 10 h -24 l -14 12 v -12 h -6 a 10 10 0 0 1 -10 -10 v -24 a 10 10 0 0 1 10 -10 z" fill="none" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="200" y="912" font-size="28" font-weight="700" fill="#111827">grilling</text>
  <text x="200" y="950" font-size="22" fill="#64748b">Asks only what you alone can answer, with a recommended answer.</text>
  <line x1="1000" y1="884" x2="1000" y2="956" stroke="#e5e7eb" stroke-width="2"/>
  <g fill="none" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 1182 894 h 30 l 16 16 v 40 a 6 6 0 0 1 -6 6 h -40 a 6 6 0 0 1 -6 -6 v -50 a 6 6 0 0 1 6 -6 z"/>
    <path d="M 1212 894 v 16 h 16"/>
    <line x1="1192" y1="926" x2="1218" y2="926"/>
    <line x1="1192" y1="940" x2="1218" y2="940"/>
  </g>
  <text x="1270" y="912" font-size="28" font-weight="700" fill="#111827">docs-conventions</text>
  <text x="1270" y="950" font-size="22" fill="#64748b">One job per file, the templates, the claim format.</text>
</svg>
